<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voron8 — Connected-component compound shapes (live)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; }
      body { display: grid; place-items: center; }
      canvas { background: #0b0f14; box-shadow: 0 0 60px #000 inset; border-radius: 6px; }
      #hud {
        position: fixed; top: 10px; left: 12px; margin: 0;
        font: 12px/1.5 ui-monospace, Menlo, monospace; color: #6b7a89;
        pointer-events: none; white-space: pre;
      }
      #nav { position: fixed; top: 10px; right: 14px; font: 12px ui-monospace, Menlo, monospace; }
      #nav a { color: #60a5fa; text-decoration: none; }
    </style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<pre id="hud"></pre>
<nav id="nav"><a href="./compound-voronoi.html">Compound-Voronoi demo →</a> · <a href="./">Voronoi demo →</a></nav>
<script type="module">
  // Free-floating open "strokes" (polylines) that are allowed to OVERLAP and
  // CROSS — there is no mutual repulsion here. When two strokes cross, their ink
  // becomes connected, so we treat them as a single compound shape: we group the
  // inputs into connected components (union-find over shared endpoints and
  // crossings) and color each component as one shape.
  //
  // The compound-Voronoi separation network (green) is then drawn only between
  // *different* components. A crossing is interior to one merged shape, so the
  // bisectors there are not separators — exactly the edges whose attribution
  // would be ambiguous (the synthesized crossing point has null provenance) are
  // also the ones we correctly drop. Watch components merge and split as strokes
  // drift through one another.
  import { init, voronoi, tessellate } from "../dist/voron8.js";

  const W = 800, H = 800;
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("hud");

  // Seeded RNG so the scene is reproducible across reloads.
  let seed = 0x1234567 >>> 0;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };

  // --- Strokes: rigid open polylines that translate + rotate and bounce off
  //     the walls. No repulsion → they cross freely. ---
  const N = 8;
  const strokes = [];
  for (let k = 0; k < N; k++) {
    const P = 3 + Math.floor(rnd() * 3);                 // 3–5 vertices
    const L = 55 + rnd() * 45;                           // half-length
    const local = [];
    let R = 0;
    for (let i = 0; i < P; i++) {
      const x = -L + (2 * L) * (i / (P - 1));
      const y = (rnd() * 2 - 1) * 34;                    // gentle wiggle → a curved stroke
      local.push([x, y]);
      R = Math.max(R, Math.hypot(x, y));
    }
    strokes.push({
      x: R + rnd() * (W - 2 * R), y: R + rnd() * (H - 2 * R),
      vx: (rnd() * 2 - 1) * 90, vy: (rnd() * 2 - 1) * 90,
      angle: rnd() * Math.PI * 2, spin: (rnd() * 2 - 1) * 0.7,
      local, R,
    });
  }

  // World-space vertices of a stroke (rotate local by angle, translate to center).
  const worldOf = (s) => {
    const ca = Math.cos(s.angle), sa = Math.sin(s.angle);
    return s.local.map(([x, y]) => [s.x + x * ca - y * sa, s.y + x * sa + y * ca]);
  };

  function step(dt) {
    for (const s of strokes) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.angle += s.spin * dt;
      if (s.x - s.R < 0) { s.x = s.R;     s.vx =  Math.abs(s.vx); }
      if (s.x + s.R > W) { s.x = W - s.R; s.vx = -Math.abs(s.vx); }
      if (s.y - s.R < 0) { s.y = s.R;     s.vy =  Math.abs(s.vy); }
      if (s.y + s.R > H) { s.y = H - s.R; s.vy = -Math.abs(s.vy); }
    }
  }

  // --- Geometry: proper segment crossing via orientation signs. ---
  const ccw = (ax, ay, bx, by, cx, cy) => (by - ay) * (cx - ax) - (bx - ax) * (cy - ay);
  function segCross(a, b, c, d) {
    const d1 = ccw(c[0], c[1], d[0], d[1], a[0], a[1]);
    const d2 = ccw(c[0], c[1], d[0], d[1], b[0], b[1]);
    const d3 = ccw(a[0], a[1], b[0], b[1], c[0], c[1]);
    const d4 = ccw(a[0], a[1], b[0], b[1], d[0], d[1]);
    return (d1 > 0) !== (d2 > 0) && (d3 > 0) !== (d4 > 0);
  }
  // Do two strokes (polylines, given as world vertex lists) cross anywhere?
  function strokesCross(p, q) {
    for (let i = 0; i + 1 < p.length; i++)
      for (let j = 0; j + 1 < q.length; j++)
        if (segCross(p[i], p[i + 1], q[j], q[j + 1])) return true;
    return false;
  }

  // --- Union-find over the input strokes. ---
  function buildComponents(world) {
    const parent = world.map((_, i) => i);
    const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
    const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
    for (let i = 0; i < world.length; i++)
      for (let j = i + 1; j < world.length; j++)
        if (strokesCross(world[i], world[j])) union(i, j);
    // Canonical root per input index, plus a count of distinct components.
    const comp = world.map((_, i) => find(i));
    const count = new Set(comp).size;
    return { comp, count };
  }

  // The connected component a site belongs to, or null if unattributable.
  // A segment site keeps its stroke's input index through either surviving
  // endpoint; the synthesized point where two strokes cross has null provenance
  // and is intentionally left unattributed (it is interior to a merged shape).
  const siteComponent = (s, comp) => {
    if (s.type === "segment") {
      const idx = s.segment?.[0]?.input ?? s.segment?.[1]?.input ?? null;
      return idx === null ? null : comp[idx];
    }
    if (s.type === "point") return s.source ? comp[s.source.input] : null;
    return null; // infinite
  };

  // A stable, well-spread hue per component (golden-angle hashing of the root).
  const hueOf = (root) => Math.floor((root * 137.508) % 360);

  // ===========================================================================
  // extractGroups(): turn voron8's compound-Voronoi *group outlines* into
  // fillable canvas polygons — one merged territory per compound shape.
  //
  // We call voronoi() with `labels` (each stroke's connected component), so the
  // result carries `groups`: per label, the outline of the union of that label's
  // cells, already given as edge indices in CCW order (the same shape as a face
  // boundary). So a compound shape is a *single* polygon, not a pile of cells —
  // no per-cell fill, no internal seams. We only tessellate each boundary edge
  // in order, close any unbounded outline against a frame enclosing the canvas,
  // and clip to the canvas. CGAL even folds each crossing point (interior to its
  // merged shape) into the territory, so the outline has no sliver holes.
  // ===========================================================================

  // Distance from (x,y) to a segment.
  const distSeg = (x, y, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / l2)) : 0;
    return Math.hypot(x - (ax + t * dx), y - (ay + t * dy));
  };
  // Component of the stroke nearest to (x,y). Used to decide which frame corners
  // belong to a territory when closing its unbounded outline (a far corner is in
  // the territory iff its nearest stroke is in that component).
  const nearestComponent = (x, y, world, comp) => {
    let best = Infinity, c = null;
    for (let k = 0; k < world.length; k++) {
      const pts = world[k];
      for (let i = 0; i + 1 < pts.length; i++) {
        const d = distSeg(x, y, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
        if (d < best) { best = d; c = comp[k]; }
      }
    }
    return c;
  };

  // Tessellate one boundary edge, oriented so its polyline begins at Voronoi
  // vertex index `startV` (or, when startV is -1, at the edge's infinite end —
  // the point farthest from its one finite vertex). The boundary order is given
  // by CGAL; this only fixes each edge's direction so successive edges connect.
  const orientStart = (e, vertices, startV, big) => {
    const pts = tessellate(e.geometry, { parabolaSamples: 14, infiniteLength: big });
    const anchor = vertices[startV >= 0 ? startV : (e.from >= 0 ? e.from : e.to)];
    const a = pts[0], b = pts[pts.length - 1];
    const d0 = (a.x - anchor.x) ** 2 + (a.y - anchor.y) ** 2;
    const dN = (b.x - anchor.x) ** 2 + (b.y - anchor.y) ** 2;
    return (startV >= 0 ? d0 <= dN : d0 >= dN) ? pts : pts.slice().reverse();
  };
  // The other endpoint (vertex index) of edge e, given one of its endpoints.
  const otherEnd = (e, v) => (e.from === v ? e.to : e.from);
  // The Voronoi vertex two consecutive boundary edges share.
  const sharedVertex = (a, b) => {
    const sa = new Set([a.from, a.to].filter((v) => v >= 0));
    return [b.from, b.to].find((v) => v >= 0 && sa.has(v));
  };

  // --- Small geometry helpers for closing & clipping. ---
  // Liang–Barsky: where the segment from inside-point `pin` leaves rectangle S.
  const exitOf = (pin, pout, S) => {
    const dx = pout.x - pin.x, dy = pout.y - pin.y;
    const p = [-dx, dx, -dy, dy];
    const q = [pin.x - S.minX, S.maxX - pin.x, pin.y - S.minY, S.maxY - pin.y];
    let t1 = 1;
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return { ...pout }; continue; }
      const r = q[i] / p[i];
      if (p[i] > 0 && r < t1) t1 = r;
    }
    return { x: pin.x + t1 * dx, y: pin.y + t1 * dy };
  };
  // Parameterize ∂S as t in [0,4): one unit per side, corners at integers.
  const perimT = (pt, S) => {
    const eps = 1e-6 * (S.maxX - S.minX + S.maxY - S.minY + 1);
    if (Math.abs(pt.y - S.minY) < eps) return (pt.x - S.minX) / (S.maxX - S.minX);
    if (Math.abs(pt.x - S.maxX) < eps) return 1 + (pt.y - S.minY) / (S.maxY - S.minY);
    if (Math.abs(pt.y - S.maxY) < eps) return 2 + (S.maxX - pt.x) / (S.maxX - S.minX);
    return 3 + (S.maxY - pt.y) / (S.maxY - S.minY);
  };
  // The four corners of ∂S, with their perimeter ids (0..3 ↔ t=0..3).
  const framesCorners = (S) => [
    { id: 0, x: S.minX, y: S.minY }, { id: 1, x: S.maxX, y: S.minY },
    { id: 2, x: S.maxX, y: S.maxY }, { id: 3, x: S.minX, y: S.maxY },
  ];
  // Corners lying strictly between params tStart→tEnd, walking ∂S in increasing
  // t, returned with their ids so a connector can be matched against a target set.
  const cornersBetween = (tStart, tEnd, corners) => {
    const span = (tEnd - tStart + 4) % 4;
    return corners
      .map((c) => ({ c, rel: (c.id - tStart + 4) % 4 }))
      .filter((o) => o.rel > 1e-9 && o.rel < span - 1e-9)
      .sort((a, b) => a.rel - b.rel)
      .map((o) => o.c);
  };

  // Close an unbounded outline's open chain against frame S. The region's
  // boundary along ∂S is the single arc, between the two exit points, whose
  // corners lie in the region — decided by the exact `inRegion(x,y)` test, so we
  // never rely on an even-odd test of a possibly self-touching polygon.
  function closeUnbounded(pts, S, inRegion) {
    if (pts.length < 2) return null;
    const exitA = exitOf(pts[1], pts[0], S);
    const exitB = exitOf(pts[pts.length - 2], pts[pts.length - 1], S);
    const base = [exitA, ...pts.slice(1, -1), exitB];
    const tA = perimT(exitA, S), tB = perimT(exitB, S);
    const corners = framesCorners(S);

    // Corner ids that belong to this region.
    const want = new Set(corners.filter((c) => inRegion(c.x, c.y)).map((c) => c.id));
    // Connector walks exitB → exitA; pick the arc whose corner set is `want`.
    const inc = cornersBetween(tB, tA, corners);                 // +t direction
    const dec = cornersBetween(tA, tB, corners).reverse();       // −t direction
    const ids = (arr) => new Set(arr.map((c) => c.id));
    const eq = (a) => a.size === want.size && [...want].every((id) => a.has(id));
    const connector = eq(ids(inc)) ? inc : eq(ids(dec)) ? dec
      : (inc.every((c) => want.has(c.id)) ? inc : dec);           // fallback
    return [...base, ...connector];
  }

  // Sutherland–Hodgman clip of a polygon to an axis-aligned box.
  function clipToBox(poly, box) {
    const lerpX = (a, b, X) => ({ x: X, y: a.y + ((X - a.x) / (b.x - a.x)) * (b.y - a.y) });
    const lerpY = (a, b, Y) => ({ x: a.x + ((Y - a.y) / (b.y - a.y)) * (b.x - a.x), y: Y });
    const pass = (pts, inside, cut) => {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const cur = pts[i], prev = pts[(i + pts.length - 1) % pts.length];
        const ci = inside(cur), pi = inside(prev);
        if (ci) { if (!pi) out.push(cut(prev, cur)); out.push(cur); }
        else if (pi) out.push(cut(prev, cur));
      }
      return out;
    };
    let p = poly;
    p = pass(p, (a) => a.x >= box.minX, (a, b) => lerpX(a, b, box.minX)); if (!p.length) return p;
    p = pass(p, (a) => a.x <= box.maxX, (a, b) => lerpX(a, b, box.maxX)); if (!p.length) return p;
    p = pass(p, (a) => a.y >= box.minY, (a, b) => lerpY(a, b, box.minY)); if (!p.length) return p;
    p = pass(p, (a) => a.y <= box.maxY, (a, b) => lerpY(a, b, box.maxY));
    return p;
  }

  // Build one polygon per compound shape from voron8's group outlines. Each
  // group is the union of a component's cells; `rings` are its outline loops
  // (usually one, more if the territory has holes or disconnected pieces).
  // Returns [{ label, path }] where path is a single fillable/strokable Path2D.
  function extractGroups(result, comp, world) {
    const { vertices, edges, groups } = result;
    if (!groups) return [];

    // Frame enclosing every finite Voronoi vertex and the whole canvas, padded
    // so unbounded outlines have room to close outside the drawable region.
    let minX = 0, minY = 0, maxX = W, maxY = H;
    for (const v of vertices) {
      if (!Number.isFinite(v.x) || !Number.isFinite(v.y)) continue;
      minX = Math.min(minX, v.x); minY = Math.min(minY, v.y);
      maxX = Math.max(maxX, v.x); maxY = Math.max(maxY, v.y);
    }
    const padX = (maxX - minX) * 0.5 + 50, padY = (maxY - minY) * 0.5 + 50;
    const S = { minX: minX - padX, minY: minY - padY, maxX: maxX + padX, maxY: maxY + padY };
    const big = (S.maxX - S.minX + S.maxY - S.minY) * 8 + 1e4;
    const box = { minX: 0, minY: 0, maxX: W, maxY: H };

    const out = [];
    for (const group of groups) {
      const inRegion = (x, y) => nearestComponent(x, y, world, comp) === group.label;
      const path = new Path2D();
      let drew = false;
      for (const ring of group.rings) {
        const b = ring.boundary.map((i) => edges[i]);
        if (b.length < 2) continue;

        // Stitch the outline edges (CCW-ordered by CGAL) into a polyline, fixing
        // each edge's direction so successive edges meet end-to-end.
        let poly = [], tip;
        if (ring.unbounded) {
          // Open arc: boundary[0] and the last edge are the outline's two rays.
          poly.push(...orientStart(b[0], vertices, -1, big));    // start at infinity
          tip = b[0].from >= 0 ? b[0].from : b[0].to;
          for (let k = 1; k < b.length; k++) {
            poly.push(...orientStart(b[k], vertices, tip, big).slice(1));
            tip = otherEnd(b[k], tip);                           // -1 on the final ray
          }
          poly = closeUnbounded(poly, S, inRegion);
          if (!poly) continue;
        } else {
          // Closed loop: seed direction from the vertex edge[0] shares with edge[1].
          const sh = sharedVertex(b[0], b[1]);
          poly.push(...orientStart(b[0], vertices, otherEnd(b[0], sh), big));
          tip = sh;
          for (let k = 1; k < b.length; k++) {
            poly.push(...orientStart(b[k], vertices, tip, big).slice(1));
            tip = otherEnd(b[k], tip);
          }
        }
        const clipped = clipToBox(poly, box);
        if (clipped.length < 3) continue;
        path.moveTo(clipped[0].x, clipped[0].y);
        for (let i = 1; i < clipped.length; i++) path.lineTo(clipped[i].x, clipped[i].y);
        path.closePath();
        drew = true;
      }
      if (drew) out.push({ label: group.label, path });
    }
    return out;
  }

  function draw(world, comp, sep, territories) {
    ctx.clearRect(0, 0, W, H);
    // Compound-shape territories: one filled-and-stroked outline per shape. The
    // fill is the union of the shape's Voronoi cells (a single polygon, so no
    // internal cell seams); the green separator network traces the shared walls.
    for (const { label, path } of territories) {
      const hue = hueOf(label);
      ctx.fillStyle = `hsla(${hue}, 70%, 55%, 0.16)`;
      ctx.fill(path, "evenodd");
      ctx.strokeStyle = `hsla(${hue}, 80%, 70%, 0.5)`; ctx.lineWidth = 1;
      ctx.stroke(path);
    }
    // Strokes, colored by the component (compound shape) they belong to.
    for (let k = 0; k < world.length; k++) {
      const pts = world[k], hue = hueOf(comp[k]);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.strokeStyle = `hsla(${hue}, 75%, 65%, 0.85)`; ctx.lineWidth = 3; ctx.stroke();
      // Endpoints, so individual strokes within a merged component stay legible.
      for (const [x, y] of [pts[0], pts[pts.length - 1]]) {
        ctx.fillStyle = `hsla(${hue}, 75%, 72%, 0.9)`;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    // Separation network between *different* compound shapes.
    const far = W * 2;
    ctx.save();
    ctx.shadowColor = "#22c55e"; ctx.shadowBlur = 8;
    ctx.strokeStyle = "#34d399"; ctx.lineWidth = 1.75;
    ctx.beginPath();
    for (const e of sep) {
      const pts = tessellate(e.geometry, { parabolaSamples: 20, infiniteLength: far });
      if (pts.length < 2) continue;
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // --- Animation loop: recompute everything each frame. ---
  let last = performance.now(), emaMs = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    step(dt);
    const world = strokes.map(worldOf);
    const { comp, count } = buildComponents(world);

    const t0 = performance.now();
    // Label each stroke with its component; voron8 returns `groups` — the outline
    // of the union of each component's cells (the compound-shape territories).
    const result = voronoi({ segments: world }, { labels: comp });
    const { edges } = result;
    // Keep only bisectors between two different connected components.
    const sep = edges.filter((e) => {
      const a = siteComponent(e.sites[0], comp), b = siteComponent(e.sites[1], comp);
      return a !== null && b !== null && a !== b;
    });
    // One filled+stroked outline polygon per compound shape.
    const territories = extractGroups(result, comp, world);
    emaMs = emaMs ? emaMs * 0.9 + (performance.now() - t0) * 0.1 : (performance.now() - t0);

    draw(world, comp, sep, territories);
    hud.textContent =
      `${N} crossing strokes → ${count} compound shape${count === 1 ? "" : "s"}\n` +
      `voronoi()+groups: ${emaMs.toFixed(1)} ms  (~${(1000 / Math.max(emaMs, 1)).toFixed(0)} fps cap)\n` +
      `territories: ${territories.length}  ·  separating edges: ${sep.length} / ${edges.length}`;

    requestAnimationFrame(frame);
  }
  await init();
  requestAnimationFrame(frame);
</script>
</body>
