<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voron8 — medial axis</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
      header { padding: 12px 16px; border-bottom: 1px solid #232733; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      header h1 { margin: 0; font-size: 16px; }
      a { color: #60a5fa; }
      select { background: #1a1e27; color: #e6e6e6; border: 1px solid #343a48; border-radius: 6px; padding: 5px 8px; font: inherit; }
      label { color: #9aa4b2; display: inline-flex; gap: 6px; align-items: center; }
      .legend { color: #9aa4b2; display: flex; gap: 14px; flex-wrap: wrap; }
      .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
      .status { color: #9aa4b2; margin-left: auto; }
      canvas { display: block; width: 100%; height: calc(100vh - 58px); }
    </style>
  </head>
  <body>
    <header>
      <h1>voron8 — medial axis</h1>
      <label>polygon <select id="pick"></select></label>
      <label>prune by
        <select id="mode">
          <option value="none">none</option>
          <option value="length">branch length (distance)</option>
          <option value="area">branch area</option>
          <option value="angle">corner sharpness (axial angle)</option>
        </select>
      </label>
      <label><input type="range" id="thresh" min="0" max="100" value="0" step="1" disabled />
        <span id="threshVal" style="min-width:5ch">—</span>
      </label>
      <div class="legend">
        <span><span class="swatch" style="background:#3b82f6"></span>polygon</span>
        <span><span class="swatch" style="background:#374151"></span>pruned interior</span>
        <span><span class="swatch" style="background:#15803d"></span>feature-pruned</span>
        <span><span class="swatch" style="background:#22c55e"></span>medial axis</span>
      </div>
      <span class="status" id="status"></span>
      <a href="./">Voronoi demo →</a>
    </header>
    <canvas id="c"></canvas>

    <script type="module">
      // Built bundle (run `npm run build`, then serve the repo and open /example/medial-axis.html).
      import { voronoi, medialAxis, tessellate } from "../dist/voron8.js";
      import { precomputeMetrics, prune } from "./prune.js";

      // Polygons from LingDong-/interesting-polygon-archive (JSON: a 3D array
      // of contours -> vertices -> [x, y]; contour 0 is the outer ring, the
      // rest are holes — exactly voron8's polygon input shape).
      const ARCHIVE =
        "https://raw.githubusercontent.com/LingDong-/interesting-polygon-archive/master/json/";
      const NAMES = [
        "skimage-horse", "matisse-icarus", "matisse-alga", "matisse-blue",
        "matisse-nuit", "misc-discobolus", "misc-fu", "mapbox-dude",
        "mapbox-building", "gray-embroidery", "held-1", "held-3", "held-7",
        "held-12", "eberly-10", "eberly-14", "elgindy-1", "mei-2", "mei-3",
        "mei-5", "meisters-3", "seidel-3", "toussaint-1a",
      ];

      const pick = document.getElementById("pick");
      const mode = document.getElementById("mode");
      const thresh = document.getElementById("thresh");
      const threshVal = document.getElementById("threshVal");
      const statusEl = document.getElementById("status");
      for (const n of NAMES) {
        const o = document.createElement("option");
        o.value = o.textContent = n;
        pick.appendChild(o);
      }

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      let current = null; // { polygons, full, medial, metrics, bbox, alive }

      function bboxOf(polygons) {
        let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
        for (const ring of polygons)
          for (const [x, y] of ring) {
            if (x < minx) minx = x; if (x > maxx) maxx = x;
            if (y < miny) miny = y; if (y > maxy) maxy = y;
          }
        return { minx, miny, maxx, maxy, diag: Math.hypot(maxx - minx, maxy - miny) };
      }

      async function loadPolygon(name) {
        statusEl.textContent = `loading ${name}…`;
        const res = await fetch(ARCHIVE + name + ".json");
        if (!res.ok) throw new Error(`fetch failed (${res.status})`);
        // contours: number[][][] — already voron8's Polygon[] (rings of [x,y]).
        const polygons = await res.json();
        const [full, medial] = await Promise.all([
          voronoi(polygons),
          medialAxis(polygons),
        ]);
        const metrics = precomputeMetrics(medial, polygons, tessellate, 24);
        current = { polygons, full, medial, metrics, bbox: bboxOf(polygons), alive: null };
        configureSlider();
        applyPrune();
        resize();
      }

      // Set the slider's range to match the chosen measure and current shape.
      function configureSlider() {
        if (!current) return;
        const off = mode.value === "none";
        thresh.disabled = off;
        const { diag, minx, miny, maxx, maxy } = current.bbox;
        let max, step;
        if (mode.value === "length") { max = 0.5 * diag; step = max / 400; }
        else if (mode.value === "area") { max = 0.05 * (maxx - minx) * (maxy - miny); step = max / 400; }
        else if (mode.value === "angle") { max = 180; step = 1; }
        else { max = 100; step = 1; }
        thresh.max = max;
        thresh.step = step || 1;
        thresh.value = 0;
        updateThreshLabel();
      }

      function updateThreshLabel() {
        if (mode.value === "none") { threshVal.textContent = "—"; return; }
        const v = +thresh.value;
        threshVal.textContent =
          mode.value === "angle" ? `${v.toFixed(0)}°`
          : mode.value === "area" ? v.toFixed(0)
          : v.toFixed(1);
      }

      function applyPrune() {
        if (!current) return;
        current.alive = prune(current.medial, current.metrics, mode.value, +thresh.value);
        const kept = current.alive.filter(Boolean).length;
        const nVerts = current.polygons.reduce((s, r) => s + r.length, 0);
        statusEl.textContent =
          `${pick.value}: ${nVerts} vertices · ${kept}/${current.medial.edges.length} medial edges kept`;
      }

      // Fit the polygon bounding box into the canvas (image coords are Y-down,
      // which maps directly to canvas, so no flip).
      function makeProjector() {
        const { minx, miny, maxx, maxy } = current.bbox;
        const pad = 24;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        const scale = Math.min((w - 2 * pad) / (maxx - minx || 1), (h - 2 * pad) / (maxy - miny || 1));
        const ox = (w - (maxx - minx) * scale) / 2;
        const oy = (h - (maxy - miny) * scale) / 2;
        return (x, y) => ({ x: ox + (x - minx) * scale, y: oy + (y - miny) * scale });
      }

      function polyline(pts, color, width) {
        if (pts.length < 2) return;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        if (!current) return;
        const P = makeProjector();
        const project = (g, n) => tessellate(g, { parabolaSamples: n }).map((p) => P(p.x, p.y));

        // Filled polygon (even-odd so holes punch through).
        ctx.beginPath();
        for (const ring of current.polygons) {
          ring.forEach(([x, y], i) => {
            const p = P(x, y);
            i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
          });
          ctx.closePath();
        }
        ctx.fillStyle = "rgba(59,130,246,0.12)";
        ctx.fill("evenodd");
        ctx.strokeStyle = "#3b82f6";
        ctx.lineWidth = 1.25;
        ctx.stroke();

        // Interior Voronoi edges the medial axis already drops (incident bisectors).
        for (const e of current.full.edges) {
          if (e.location === "interior") polyline(project(e.geometry, 20), "#374151", 1);
        }

        // Medial axis: feature-pruned branches dim, survivors bright on top.
        current.medial.edges.forEach((e, i) => {
          if (current.alive && current.alive[i]) return;
          polyline(project(e.geometry, 24), "#15803d", 1.5);
        });
        current.medial.edges.forEach((e, i) => {
          if (current.alive && !current.alive[i]) return;
          polyline(project(e.geometry, 24), "#22c55e", 2);
        });
      }

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.clientWidth * dpr;
        canvas.height = canvas.clientHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      window.addEventListener("resize", resize);
      mode.addEventListener("change", () => { configureSlider(); applyPrune(); draw(); });
      thresh.addEventListener("input", () => { updateThreshLabel(); applyPrune(); draw(); });
      pick.addEventListener("change", () =>
        loadPolygon(pick.value).catch((e) => (statusEl.textContent = "error: " + e.message)),
      );

      loadPolygon(pick.value).catch((e) => (statusEl.textContent = "error: " + e.message));
    </script>
  </body>
</html>
