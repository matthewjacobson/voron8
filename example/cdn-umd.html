<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voron8 — UMD build from a CDN</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
      header { padding: 12px 16px; border-bottom: 1px solid #232733; }
      header h1 { margin: 0 0 4px; font-size: 16px; }
      header p { margin: 0; color: #9aa4b2; }
      header code { color: #60a5fa; }
      canvas { display: block; width: 100%; height: calc(100vh - 72px); }
    </style>
  </head>
  <body>
    <header>
      <h1>voron8 — UMD build from a CDN</h1>
      <p>
        No bundler, no build step: this page loads
        <code>voron8.umd.js</code> from jsDelivr via a classic
        <code>&lt;script&gt;</code> tag, which exposes a global <code>voron8</code>.
      </p>
    </header>
    <canvas id="c"></canvas>

    <!-- UMD build straight from the CDN. The package's `jsdelivr` field points
         at dist/voron8.umd.js, so the version-less path below resolves to it and
         always tracks the latest release. Add `@<version>` (e.g. voron8@3.1.0)
         to pin for reproducibility. (Use the .js build, not .cjs: CDNs serve
         .cjs with a non-JS MIME type that blocks <script> execution.) -->
    <script src="https://cdn.jsdelivr.net/npm/voron8/dist/voron8.umd.js"></script>
    <script>
      // `voron8` is now a global. init() loads the inlined wasm (the only async
      // step); voronoi()/medialAxis() are synchronous afterwards.
      voron8.init().then(() => {
        // A mix of every site kind: an L-shape polygon (reflex corner ->
        // parabolic bisectors), open segments/polylines, and isolated points.
        const polygons = [
          [ [40, 40], [320, 40], [320, 180], [160, 180], [160, 360], [40, 360] ],
        ];
        const segments = [
          [ [420, 110], [620, 130] ],             // a single line segment
          [ [430, 320], [520, 250], [610, 300] ], // an open polyline
        ];
        const points = [ [480, 60], [600, 210], [440, 200] ];

        const { vertices, edges } = voron8.voronoi({ points, segments, polygons });

        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");

        function line(pts, color, width) {
          if (pts.length < 2) return;
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          // Clip rays/lines to the visible canvas so exterior edges stay sane.
          const far = Math.max(canvas.clientWidth, canvas.clientHeight) * 2;

          for (const e of edges) {
            const pts = voron8.tessellate(e.geometry, { parabolaSamples: 28, infiniteLength: far });
            line(pts, e.location === "interior" ? "#22c55e" : "#6b7280",
                 e.location === "interior" ? 2 : 1);
          }

          // Input geometry on top: polygons (closed), segments (open), points.
          for (const ring of polygons) {
            line([...ring, ring[0]].map(([x, y]) => ({ x, y })), "#3b82f6", 1.5);
          }
          for (const seg of segments) {
            line(seg.map(([x, y]) => ({ x, y })), "#a855f7", 2);
          }
          for (const [x, y] of points) {
            ctx.fillStyle = "#06b6d4";
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
          }

          // Vertices (every input vertex highlighted; Voronoi vertices white).
          for (const v of vertices) {
            ctx.fillStyle = v.isInput ? "#f59e0b" : "#e6e6e6";
            ctx.beginPath();
            ctx.arc(v.x, v.y, v.isInput ? 4 : 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function resize() {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = canvas.clientWidth * dpr;
          canvas.height = canvas.clientHeight * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          draw();
        }
        window.addEventListener("resize", resize);
        resize();
      });
    </script>
  </body>
</html>
