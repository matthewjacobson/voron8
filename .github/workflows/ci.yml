name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The wasm artifact (src/core/voronoi.js) is committed, so CI needs no
      # Emscripten/CGAL toolchain — only the JS bundle + test run.
      - run: npm run build

      - run: npm test
