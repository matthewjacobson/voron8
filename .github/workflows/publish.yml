name: Publish

# Publishes to npm when a version tag (e.g. v0.1.0) is pushed, using npm
# Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
#
# One-time bootstrap: OIDC can't create a package, only publish to an existing
# one. Publish the first version locally (`npm publish` while logged in), then
# add this repo + workflow as a Trusted Publisher under the package's npm
# settings. Every release after that flows through this workflow.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the tag
      id-token: write # mints the OIDC token npm exchanges for publish auth
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing requires Node >= 22.14.0.
          node-version: 22

      # ...and npm >= 11.5.1, which is newer than the runner's bundled npm.
      - run: npm install -g npm@latest

      - run: npm ci

      # The wasm artifact (src/core/voronoi.js) is committed but dist/ is not,
      # so build the bundle the tests import before running them.
      - run: npm run build

      - run: npm test

      # No token, no --provenance: OIDC authenticates the publish and npm
      # generates the provenance attestation automatically.
      - run: npm publish

      # Create the matching GitHub Release, using this version's CHANGELOG
      # section as the notes (falling back to auto-generated notes if absent).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md)"
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" | gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-file -
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
