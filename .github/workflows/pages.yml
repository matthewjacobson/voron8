name: Pages

# Builds the bundle and deploys the interactive example to GitHub Pages.
# dist/ is gitignored, so we build it here rather than committing it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Assemble the site preserving the example's "../dist/voron8.js" import:
      # example -> /example/index.html, bundle -> /dist/voron8.js, plus a root
      # redirect so the bare Pages URL lands on the demo.
      - name: Assemble site
        run: |
          mkdir -p _site/example _site/dist
          cp -r example/. _site/example/
          cp dist/voron8.js _site/dist/voron8.js
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./example/">\n' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
